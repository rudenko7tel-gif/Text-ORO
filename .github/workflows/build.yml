name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Signing key from secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "Нет секрета SIGNING_KEY — сборка остановлена"; exit 1; fi
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/oro.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/oro.jks" >> $GITHUB_ENV
      - run: gradle assembleDebug --no-daemon
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - name: Name APK by version
        run: |
          V=$(grep versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          echo "V=$V" >> $GITHUB_ENV
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/TextORO_v$V.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TextORO_v${{ env.V }}
          path: out/TextORO_v${{ env.V }}.apk
      - name: Push APK to builds branch
        run: |
          cd out
          git init -q -b builds
          git config user.name "build-bot"; git config user.email "build@oro"
          git add . && git commit -qm "APK v$V"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
